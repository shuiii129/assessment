<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Governance RAG System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-logo">
                <div class="logo-icon"></div>
                <h1>AGORA RAG</h1>
            </div>
            
            <div class="header-controls">
                <div class="model-select-wrapper">
                    <label for="model-select">LLM Model:</label>
                    <select id="model-select">
                        <option value="gemini-2.5-flash">Gemini 2.5 Flash (Fast)</option>
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                        <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                    </select>
                </div>
                
                <div id="status-badge" class="status-badge disconnected">
                    <span class="status-dot"></span>
                    <span id="status-text">Connecting...</span>
                </div>
            </div>
        </header>

        <!-- Main Body -->
        <main class="app-main">
            <!-- Left Side: Chat Workspace -->
            <section class="chat-section">
                <div id="chat-messages" class="chat-messages">
                    <!-- Welcome / Quick Starts -->
                    <div class="welcome-card" id="welcome-card">
                        <h2>Retrieval-Augmented Generation Dashboard</h2>
                        <p>Ask questions grounded in the ETO AGORA AI Governance dataset. The system enforces strict grounding rules and provides verifiable source links.</p>
                        
                        <div class="quick-starts">
                            <h3>Suggested Queries:</h3>
                            <div class="quick-start-buttons">
                                <button class="qs-btn" data-query="What is the goal of EO 13859?">Goal of EO 13859</button>
                                <button class="qs-btn" data-query="What is the UK Artificial Intelligence (Regulation) Act 2024?">UK AI Regulation Act 2024</button>
                                <button class="qs-btn" data-query="List some AI-related laws from U.S. states and localities.">U.S. State & Local Laws</button>
                                <button class="qs-btn" data-query="How do I bake a chocolate cake?">Test Grounding (Cake recipe)</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Input area -->
                <div class="input-container">
                    <form id="query-form" class="query-form">
                        <input type="text" id="query-input" placeholder="Ask a question about AI governance..." required autocomplete="off">
                        <button type="submit" id="submit-btn" class="submit-btn">
                            <span class="btn-text">Submit</span>
                            <div class="loading-spinner hidden"></div>
                        </button>
                    </form>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
